services:
  - type: web
    name: id-sensor-mvp
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: AUTO_SEED_DEMO_DATA
        value: true
      - key: EXPO_PUSH_ENABLED
        value: true
      - key: APP_DEVICE_TOKEN_SECRET
        value: idsensor-mvp-test-device-token-secret
      - key: PUBLIC_API_URL
        value: https://id-sensor-mvp.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: MQTT_BRIDGE_ENABLED
        value: true
      - key: MQTT_HOST
        value: c0d66ad786a241bf91a20a7509b2ac7c.s1.eu.hivemq.cloud
      - key: MQTT_PORT
        value: 8883
      - key: MQTT_USERNAME
        value: mkgw4
      - key: MQTT_PASSWORD
        sync: false
      - key: MQTT_CLIENT_ID
        value: idsensor-backend-einstein-01
      - key: MQTT_TOPIC
        value: idsensor/einstein/mkgw4-01/uplink
